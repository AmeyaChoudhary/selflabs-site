<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SelfLabs</title>
<meta name="description" content="Try one small change for 14 days. See if it actually helps you.">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SelfLabs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Every screen is drawn on a fixed 390 x 844 stage, then scaled to the phone. -->
<div id="desk">
  <div id="phone">
    <div id="clip">
      <div id="stage" data-ground="white">
        <div id="ground" aria-hidden="true"><div id="g-sky"></div><div id="g-floor"></div></div>
        <main id="screens"></main>
        <div id="steps" aria-hidden="true"><span></span><span></span></div>
        <nav id="tabs" aria-label="Sections">
          <button class="b tab" data-tab="today">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
            <span>Today</span>
          </button>
          <button class="b tab" data-tab="atlas">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="6"/><path d="M3.5 11C9 10 14 11 20.5 9.5M11 10.6C10.5 14 11 17.5 11.5 20.5"/></svg>
            <span>Atlas</span>
          </button>
        </nav>
        <div id="sheet"></div>
      </div>
    </div>
    <div id="island" aria-hidden="true"></div>
  </div>
  <p id="desk-note">Made for phones. Open this page on yours.</p>
</div>
<div id="probe" aria-hidden="true"></div>
<noscript><p style="font:17px/22px sans-serif;padding:24px">SelfLabs needs JavaScript to run.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
