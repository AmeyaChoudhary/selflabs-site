<div id="solo"></div>

<script src="../assets/screens.js?v=2"></script>
<script>
(function () {
  'use strict';
  var doc = document, root = doc.documentElement;
  var screens = window.SELFLABS_SCREENS || [];
  var only = new URLSearchParams(location.search).get('only');

  function device(id) {
    var d = doc.createElement('div');
    d.className = 'device';
    d.setAttribute('data-screen', id);
    return d;
  }

  if (only) {
    // ?only=<id>: just that phone, nothing else, transparent page; its animation plays straight away
    doc.body.classList.add('solo');
    var one = device(only);
    one.classList.add('in-view');
    doc.getElementById('solo').appendChild(one);
  } else {
    var gallery = doc.getElementById('gallery');
    var groups = [];
    screens.forEach(function (s) { if (groups.indexOf(s.group) < 0) groups.push(s.group); });
    groups.forEach(function (name) {
      var section = doc.createElement('section');
      section.className = 'group';
      var title = doc.createElement('h2');
      title.className = 'group-title rv';
      title.textContent = name;
      var shots = doc.createElement('div');
      shots.className = 'shots';
      screens.filter(function (s) { return s.group === name; }).forEach(function (s, i) {
        var figure = doc.createElement('figure');
        figure.className = 'shot rv';
        figure.style.setProperty('--i', i + 1);
        var d = device(s.id);
        d.setAttribute('role', 'img');
        d.setAttribute('aria-label', 'App screen: ' + s.title);
        var caption = doc.createElement('figcaption');
        caption.className = 'shot-cap';
        caption.textContent = s.title;
        figure.appendChild(d);
        figure.appendChild(caption);
        shots.appendChild(figure);
      });
      shots.setAttribute('data-n', shots.children.length);
      if (shots.children.length > 4) section.className += ' group-wide';   // a long group gets its own row
      section.appendChild(title);
      section.appendChild(shots);
      gallery.appendChild(section);
    });
  }

  mountPhones();
  // the screens are pictures here: keep their buttons out of the tab order
  Array.prototype.forEach.call(doc.querySelectorAll('.phone'), function (p) { p.inert = true; });

  try {
    // reveal on scroll; a phone's own animation starts when it comes into view
    var targets = Array.prototype.slice.call(doc.querySelectorAll('.rv, .device'));
    var show = function (el) { el.classList.add('is-in', 'in-view'); };
    if (!('IntersectionObserver' in window)) {
      targets.forEach(show);
    } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { show(en.target); io.unobserve(en.target); } });
      }, { threshold: 0.18, rootMargin: '0px 0px -6% 0px' });
      targets.forEach(function (t) { io.observe(t); });
    }
    // poke a Nim, it squashes
    Array.prototype.forEach.call(doc.querySelectorAll('[data-poke]'), function (el) {
      el.addEventListener('pointerdown', function () {
        el.classList.remove('is-squash');
        void el.offsetWidth;
        el.classList.add('is-squash');
      });
    });
  } catch (err) {
    root.classList.remove('js');
  }
})();
</script>
